name: digiroutes_app
description: "DigiRoute — Share your exact doorstep location with a 10-character DIGIPIN."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps & Location
  geolocator: ^13.0.2

  # Navigation
  go_router: ^14.6.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  http: ^1.2.2

  # Local Storage (token)
  shared_preferences: ^2.3.3

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # Sharing
  share_plus: ^10.1.2

  # Fonts & UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_platform_interface: ^2.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
