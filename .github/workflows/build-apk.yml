name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Restore Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/keystore/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyPassword=$RELEASE_KEY_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          storeFile=../keystore/upload-keystore.jks
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Determine Release Tag
        id: release_info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//' | tr -d '[:space:]')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "title=DigiRoutes v$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## DigiRoutes Android Application (.APK)

            Download and install the official DigiRoutes Android app directly onto your phone:
            - **Download File**: `app-release.apk`
            - **Direct Download Link**: [app-release.apk](https://github.com/kushkumarkashyap7280/digiroutes_app/releases/download/${{ steps.release_info.outputs.tag }}/app-release.apk)

            ### Features:
            - 🎯 Precise 10-character India Post DIGIPIN lookup & decoding
            - 🗺️ Interactive full-screen Google Maps
            - 📸 Doorstep photo uploads and address card management
            - 🚀 Turn-by-turn navigation launcher
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
